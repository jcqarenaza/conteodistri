name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check backend syntax
        run: node --check backend/index.js && echo "Syntax OK"

      - name: Verify HTML exists
        run: test -f frontend/index.html && echo "Frontend OK"

      - name: Verify schema exists
        run: test -f database/schema.sql && echo "Schema OK"
